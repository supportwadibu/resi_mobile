# Machine de dev : 15 Go de RAM. Le build release lance en parallele le daemon
# Gradle, le daemon Kotlin et un worker R8 hors process : reserver 8 Go de heap
# au seul daemon Gradle faisait echouer l'allocation native de G1 pendant R8
# (hs_err "insufficient memory ... 2130706432 bytes for G1 virtual space").
# 4 Go couvrent largement assembleRelease en laissant la place aux autres process.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Le daemon Kotlin herite sinon de reglages memoire genereux et double la
# pression sur une machine deja juste.
kotlin.daemon.jvmargs=-Xmx2G

android.useAndroidX=true
