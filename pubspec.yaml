name: resi_africa
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^9.2.1
  auto_route: ^11.1.0
  dio: ^5.9.2
  connectivity_plus: ^7.1.1
  pretty_dio_logger: ^1.4.0
  flutter_secure_storage: ^10.3.1
  easy_localization: ^3.0.8
  logger: ^2.7.0
  intl: ^0.20.2
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.3.0
  latlong2: ^0.9.1
  flutter_map: ^8.3.0
  url_launcher: ^6.3.0
  image_picker: ^1.2.2
  shared_preferences: ^2.3.5
  firebase_core: ^4.13.0
  google_sign_in: ^6.3.0
  country_picker: ^2.0.27
  lottie: ^3.3.2
  phone_numbers_parser: ^9.0.5
  geolocator: ^14.0.3
  flutter_inappwebview: ^6.1.5
  pdf: ^3.11.1
  printing: ^5.13.4
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  auto_route_generator: ^10.5.0
  flutter_launcher_icons: ^0.14.4

  sqflite_common_ffi: ^2.3.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logotype.png"
  min_sdk_android: 21
  adaptive_icon_background: #FFFFFF

flutter:
  uses-material-design: true

  assets:
    - assets/translations/en.json
    - assets/translations/fr.json
    - assets/icons/
    - assets/images/
    - assets/lottie/
    - assets/images/resi/detail_1.png
    - assets/data/cities/
    - assets/data/communes/